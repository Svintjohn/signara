name: Android APK

# Builds a debug APK on every push so you can download it from the run page
# (Actions -> the run -> Artifacts) and install it on a phone.
#
# UNTESTED. Needs the android/ folder to be committed first
# (run `flutter create --platforms=android --org com.signara .` locally once,
# apply the README setup steps, then commit android/).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: signara-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

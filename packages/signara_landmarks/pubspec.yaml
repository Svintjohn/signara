name: signara_landmarks
description: Camera + MediaPipe hand landmarks for Signara (Android native, web via JS). Only landmarks cross to Dart, never frames.
version: 0.0.2
publish_to: "none"

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  web: ^1.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.signara.landmarks
        pluginClass: SignaraLandmarksPlugin

name: signara
description: Offline-first two-way sign language app (ASL first, FSL-extensible).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  signara_landmarks:
    path: packages/signara_landmarks

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/vocab/
    - assets/branding/
